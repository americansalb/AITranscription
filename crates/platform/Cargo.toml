[package]
name = "platform"
version = "0.1.0"
edition = "2021"
description = "The only place operating-system code lives: reading the accessibility tree and tracking focus, one implementation per platform, behind one interface."
publish = false

[dependencies]
logic = { path = "../logic" }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
